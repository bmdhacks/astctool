name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build kram
        shell: bash
        run: ./scripts/build-kram.sh

      - name: Test
        run: cargo test --all

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build and package
        run: |
          cargo build --release
          cargo packager --release --formats nsis

      - name: E2E on release binary
        shell: bash
        run: |
          rm -f e2e-pack.tar.zst report.json astctool.log
          target/release/astctool.exe --cli -i tests/fixtures/pack -o e2e-pack.tar.zst --jobs 2
          grep -q '"succeeded": 2' report.json
          grep -q '"failed_count": 0' report.json
          test -s e2e-pack.tar.zst

      - name: Verify installed installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/*setup.exe | Select-Object -First 1
          Write-Host "installing $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $bin = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter astctool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) { throw "installed astctool.exe not found under LOCALAPPDATA" }
          Remove-Item e2e-inst.tar.zst, report.json, astctool.log -ErrorAction SilentlyContinue
          & $bin.FullName --cli -i tests/fixtures/pack -o e2e-inst.tar.zst --jobs 2
          if (-not (Test-Path e2e-inst.tar.zst)) { throw "no archive from installed app" }
          if ((Get-Content report.json -Raw) -notmatch '"succeeded": 2') { throw "unexpected report from installed app" }
          Write-Host "installed app ok"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/*setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
      - uses: lukka/get-cmake@latest

      - name: Build kram (universal)
        shell: bash
        run: ./scripts/build-kram.sh

      - name: Test
        run: cargo test --all

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build universal and package
        shell: bash
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/astctool \
            target/x86_64-apple-darwin/release/astctool \
            -output target/release/astctool
          cargo packager --release --formats dmg

      - name: E2E on release binary
        shell: bash
        run: |
          rm -f e2e-pack.tar.zst report.json astctool.log
          target/release/astctool --cli -i tests/fixtures/pack -o e2e-pack.tar.zst --jobs 2
          grep -q '"succeeded": 2' report.json
          grep -q '"failed_count": 0' report.json
          test -s e2e-pack.tar.zst

      - name: Verify packaged dmg
        shell: bash
        run: |
          DMG=$(ls target/release/*.dmg | head -1)
          echo "mounting $DMG"
          MOUNTPOINT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNTPOINT"
          APP=$(ls -d "$MOUNTPOINT"/*.app | head -1)
          BIN=$(ls "$APP/Contents/MacOS" | head -1)
          rm -f e2e-dmg.tar.zst report.json astctool.log
          "$APP/Contents/MacOS/$BIN" --cli -i tests/fixtures/pack -o e2e-dmg.tar.zst --jobs 2
          grep -q '"succeeded": 2' report.json
          test -s e2e-dmg.tar.zst
          hdiutil detach "$MOUNTPOINT"
          rmdir "$MOUNTPOINT"
          echo "packaged app ok"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/*.dmg

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename assets
        shell: bash
        run: |
          cd dist
          ver="${GITHUB_REF_NAME#v}"
          for f in *.exe; do [ -e "$f" ] && mv "$f" "astctool_${ver}_windows-x64-setup.exe"; done
          for f in *.dmg; do [ -e "$f" ] && mv "$f" "astctool_${ver}_macos-universal.dmg"; done
          ls -la

      - name: Prune interim releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName -q '.[].tagName' | while read -r t; do
            [ -z "$t" ] && continue
            if [ "$t" != "${GITHUB_REF_NAME}" ]; then
              echo "deleting release $t"
              gh release delete "$t" -y --cleanup-tag || true
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
