[package]
name = "astctool"
version = "0.1.0"
edition = "2024"
description = "Repackage a texture folder into an ARMSX2 ASTC KTX1 tar.zst pack"
license = "MIT"

[package.metadata.packager]
product-name = "ASTC Texture Pack Builder"
identifier = "com.bmdhacks.astctool"
category = "Utility"
icons = ["icons/icon.png"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.36.2"
env_logger = "0.11.11"
log = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
zip = "8.6.0"
zstd = "0.14.0"

[profile.release]
strip = true
